---
layout: default
---

<button id="scroll-top" aria-label="Scroll to top">↑</button>

<article class="post-content">
  <h1 class="post-title">{{ page.title }}</h1>

  <p>{{ page.date | date: "%Y-%m-%d" }}</p>

  {{ content }}
</article>

{% for tag in page.tags %}
<span class="muted">#{{ tag }}</span>
{% endfor %}
