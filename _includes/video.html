<figure class="post-figure">
  <video class="post-video" controls preload="metadata" playsinline>
    <source src="{{ include.src | relative_url }}" type="video/mp4" />
    Your browser does not support the video tag.
  </video>

  {% if include.caption %}
  <figcaption class="post-caption">{{ include.caption }}</figcaption>
  {% endif %}
</figure>
