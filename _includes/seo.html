<title>
  {% if page.title %} {% if page.lang == 'ru' %} {{ site.title_ru }} - {{
  page.title }} {% else %} {{ site.title }} - {{ page.title }} {% endif %} {%
  else %} {% if page.lang == 'ru' %} {{ site.title_ru }} - {{ page.title }} {%
  else %} {{ site.title }} - {{ page.title }} {% endif %} {% endif %}
</title>

<meta
  name="description"
  content="{{ page.description | default: site.description }}"
/>

<meta
  name="author"
  content="{% if page.lang == 'ru' %}{{ site.title_ru }}{% else %}{{ site.title }}{% endif %}"
/>
<meta name="robots" content="index,follow" />
<meta name="color-scheme" content="light dark" />

<meta
  property="og:title"
  content="
    {% if page.title %}
    {% if page.lang == 'ru' %}
       {{ site.title_ru }} - {{ page.title }}
    {% else %}
       {{ site.title }} - {{ page.title }}
    {% endif %}
  {% else %}
    {% if page.lang == 'ru' %}
       {{ site.title_ru }} - {{ page.title }}
    {% else %}
       {{ site.title }} - {{ page.title }}
    {% endif %}
  {% endif %}
  "
/>
<meta
  property="og:description"
  content="{{ page.description | default: site.description }}"
/>
<meta property="og:image" content="/assets/images/share.jpg" />
<meta property="og:url" content="{{ site.url }}{{ page.url }}" />
<meta name="twitter:card" content="summary_large_image" />

<link rel="canonical" href="{{ site.url }}{{ page.url }}" />

{% if page.layout == "post" %}
<meta property="og:type" content="article" />
{% else %}
<meta property="og:type" content="website" />
{% endif %}

<meta name="yandex-verification" content="5799d94710cfdf04" />

<link
  rel="alternate"
  type="application/rss+xml"
  title="{{ site.title }}"
  href="/feed.xml"
/>

<link rel="alternate" hreflang="en" href="{{ site.url }}/" />
<link rel="alternate" hreflang="ru" href="{{ site.url }}/ru/" />
